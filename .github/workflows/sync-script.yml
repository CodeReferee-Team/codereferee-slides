# main에 script.md가 올라오면 대본을 index.html 발표자 노트에 넣어 커밋한다.
# python tools/sync_script.py 를 빼먹고 push해도 발표자 창에 대본이 반영되게 하기 위해서다.
name: 대본 동기화

on:
  push:
    branches: [main]
    paths: [index.html, script.md, tools/sync_script.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-script
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: index.html 발표자 노트 갱신
        run: python tools/sync_script.py | tee sync.log

      - name: 확인 필요 항목을 경고로 표시
        run: |
          grep '^확인 필요:' sync.log | while read -r line; do echo "::warning title=대본 확인::$line"; done || true

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "docs(slides): script.md 대본을 발표자 노트에 반영한다"
          git pull --rebase origin main
          git push origin HEAD:main
