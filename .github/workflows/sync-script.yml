# main에 index.html이 올라오면 발표자 노트로 script.md를 다시 만들어 커밋한다.
# GitHub 웹에서 index.html만 고쳐도 script.md가 따라오게 하기 위해서다.
name: 대본 동기화

on:
  push:
    branches: [main]
    paths: [index.html, script.md, tools/sync_script.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-script
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: script.md 갱신
        run: python tools/sync_script.py | tee sync.log

      - name: 단계 수 확인 결과를 경고로 표시
        run: |
          grep '^확인 필요:' sync.log | while read -r line; do echo "::warning title=대본 확인::$line"; done || true

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- script.md; then
            echo "script.md 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.md
          git commit -m "docs(script): index.html 발표자 노트로 script.md를 맞춘다"
          git pull --rebase origin main
          git push origin HEAD:main
